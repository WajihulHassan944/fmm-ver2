name: Repair frontend lockfile (draft branch only)

on:
  push:
    branches:
      - fix/growth-engine-fight-campaigns
    paths:
      - .github/workflows/repair-growth-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update lockfile without changing package definitions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm clean dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify page guard
        run: npm run guard:pages
      - name: Commit validated lockfile to draft branch
        run: |
          test "$GITHUB_REF_NAME" = "fix/growth-engine-fight-campaigns"
          git diff --exit-code -- package.json
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Repair frontend npm lockfile for existing @vercel/blob dependency"
            git push origin HEAD:fix/growth-engine-fight-campaigns
          fi
