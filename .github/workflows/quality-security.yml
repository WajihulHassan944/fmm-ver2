name: Quality and security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Playwright 1.56 supports Ubuntu 24.04. ubuntu-latest is migrating to
    # Ubuntu 26 and failed during its browser/dependency installation.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify fight registry regressions
        run: node scripts/fight-registry-regression.test.cjs
      - run: npm ci --ignore-scripts
      - name: Growth iframe and credential-boundary security tests
        run: npm run test:growth-integration
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium for original-console integration tests
        run: npx playwright install --with-deps chromium
      - name: Browser-test original admin console integration (isolated fixtures only)
        run: npm run test:growth-browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-admin-integration-evidence
          path: test-results/
      - name: Check live admin login CORS from Growth SSO preview (no credentials)
        if: github.event_name == 'pull_request' && github.head_ref == 'integration/growth-engine-first-party-session'
        shell: bash
        run: |
          set -euo pipefail
          origin=https://fmm-ver2-git-integration-g-3a9420-kelly-davis-projects-6c108d0b.vercel.app
          backend=https://fantasymmadness-game-server-three-taupe.vercel.app
          headers=$(mktemp)
          status=$(curl --connect-timeout 8 --max-time 20 -sS -D "$headers" -o /dev/null -w '%{http_code}' -X OPTIONS "$backend/admin/login" -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type')
          allowed=$(grep -i '^access-control-allow-origin:' "$headers" | head -1 | tr -d '\r' | cut -d' ' -f2- || true)
          methods=$(grep -i '^access-control-allow-methods:' "$headers" | head -1 | tr -d '\r' | cut -d' ' -f2- || true)
          echo "Preflight HTTP $status; exact preview origin allowed: $([ "$allowed" = "$origin" ] && echo yes || echo no); POST allowed: $(echo "$methods" | grep -Eqi '(^|[, ])POST([, ]|$)' && echo yes || echo no)"
          [[ "$status" == 200 || "$status" == 204 ]] && [[ "$allowed" == "$origin" ]] && echo "$methods" | grep -Eqi '(^|[, ])POST([, ]|$)'
      - run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
