name: TEMP website compatible audit fixes

# TEMPORARY (removed before review): applies only semver-compatible fixes for
# non-Next.js findings (npm audit fix, never --force) plus the same scoped zod
# override used on the backend, then commits the result for review.
on:
  pull_request:
    paths: ['.github/workflows/temp-web-audit.yml']
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'exp/website-audit-compatible'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts
      - name: Report, fix compatible (no --force), report
        run: |
          cat > /tmp/rep.js <<'JS'
          const a = require(process.argv[2]); const v = Object.values(a.vulnerabilities || {});
          const fix = (x) => x.fixAvailable === true ? 'compatible' : x.fixAvailable ? `${x.fixAvailable.name}@${x.fixAvailable.version}${x.fixAvailable.isSemVerMajor ? ' BREAKING' : ''}` : 'none';
          const via = (x) => [].concat(x.via).map((y) => typeof y === 'string' ? y : `${y.url} ${y.range}`).join(' ; ');
          console.log(`::notice title=${process.argv[3]}::${JSON.stringify(a.metadata?.vulnerabilities)}%0A` + v.map((x) => `${x.severity.toUpperCase()} ${x.name} ${x.range} fix:${fix(x)} via ${via(x)}`).join('%0A'));
          JS
          npm audit --json > /tmp/b.json || true; node /tmp/rep.js /tmp/b.json "Website audit BEFORE (all deps)"
          node -e 'const p=require("./package.json");p.overrides=p.overrides||{};p.overrides["@vercel/cli-config"]={zod:"4.6.7"};require("fs").writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci --ignore-scripts
          npm audit --json > /tmp/a.json || true; node /tmp/rep.js /tmp/a.json "Website audit AFTER (all deps)"
          echo "::notice title=Changed versions::$(git diff -U0 package-lock.json | grep -B1 -E '^[-+]\s+"version"' | grep -vE '^--$' | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g' | head -c 30000)"
          echo "::notice title=package.json diff::$(git diff package.json | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Security: compatible website dependency fixes (npm audit fix, no --force) + scoped zod override"
          git push origin HEAD:${{ github.head_ref }}
