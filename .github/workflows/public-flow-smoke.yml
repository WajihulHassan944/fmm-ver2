name: Public fight flow monitor

on:
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A main push triggers deployment; give the public site time to update.
      - if: github.event_name == 'push'
        run: sleep 90
      - run: npm run smoke:public
